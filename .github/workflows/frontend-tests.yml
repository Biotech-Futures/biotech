name: Frontend unit tests

# Runs the vitest suites for both frontends on every push and PR. A separate
# file on purpose: the existing deploy and typecheck workflows belong to
# other teams and stay untouched (plan Phase 8-4).
#
# E2E is deliberately NOT here yet. The Playwright suite needs a running
# backend with Postgres and seeded accounts; wiring that into CI is its own
# piece of work, and a half-configured job that silently skips would read
# as coverage that does not exist.
on:
  push:
    paths:
      - "frontend/**"
      - "adminweb/**"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "adminweb/**"
      - ".github/workflows/frontend-tests.yml"

jobs:
  portal:
    name: Portal (Vue) vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit --run

  adminweb:
    name: Admin (React) vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adminweb
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: adminweb/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --run
      # The admin app's typecheck ran nowhere: frontend-typecheck.yml covers
      # the portal only. Not a substitute for a test — a security guard
      # neutered to `if (false && ...)` leaves the types perfectly clean —
      # but code that does not compile should not reach review either.
      - run: pnpm typecheck
