# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

# The backend and the frontend in one workflow, so neither deploys unless
# every check for the change passes: a change to both ships both or neither.
# Only the sides a change touches are checked and deployed, and the two
# deploys run side by side.
name: Build, test and deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/main_biotechbe.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/main_biotechbe.yml'
  workflow_dispatch:

# A new push to a pull request cancels the run for the one before it, which
# the new run covers, since it checks the whole pull request. Runs on main are
# never cancelled: each one compares only with the push before it, so
# cancelling one could leave its changes undeployed. Their deploys queue
# instead (see the deploy jobs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which sides this change touches, so only those are checked and deployed.
  # Running it by hand redeploys the backend, as it did before the frontend
  # moved in here. A closed pull request checks nothing; it only takes its
  # preview site down, if it had one.
  changes:
    runs-on: ubuntu-latest
    name: What changed
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ github.event.action != 'closed' && (github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true') }}
      frontend: ${{ github.event.action != 'closed' && steps.filter.outputs.frontend == 'true' }}
      frontend_preview: ${{ steps.filter.outputs.frontend == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Compare with the last commit
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/main_biotechbe.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/main_biotechbe.yml'

  backend_tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    name: "SQLite: backend tests"
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        working-directory: ./backend
        # All test suites live under backend/tests/ (mirror layout per app), so the
        # single `tests` label discovers everything. Keep new tests in that tree —
        # an in-app tests.py would need its own label here or CI silently skips it.
        run: coverage run manage.py test tests --settings=config.settings_test --noinput

      - name: Enforce coverage threshold (>= 60%)
        working-directory: ./backend
        run: coverage report --fail-under=60

      # The same tests with the calendar moved on, so a test tied to today's
      # date or year fails in the change that adds it, not on the day it
      # would start blocking deploys (see backend/tests/clock.py).
      - name: Run tests a year and a month ahead
        working-directory: ./backend
        env:
          TEST_CLOCK_SHIFT_DAYS: '400'
        run: python manage.py test tests --settings=config.settings_test --noinput --testrunner=tests.clock.ShiftedClockRunner

      - name: Run tests just after the next New Year
        working-directory: ./backend
        env:
          TEST_CLOCK_AT: new-year
        run: python manage.py test tests --settings=config.settings_test --noinput --testrunner=tests.clock.ShiftedClockRunner

      - name: Generate coverage XML
        if: always()
        working-directory: ./backend
        run: coverage xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  # The tests build their tables straight from the models and never load a
  # migration, and production migrates on deploy. So this checks the
  # migrations themselves, on the same Postgres version as docker-compose.dev.yml.
  migrations:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    name: Migrations
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fails when two branches each added the next migration to one app (fix
      # with `python manage.py makemigrations --merge`), or when a model
      # changed with no migration.
      - name: Check for migration conflicts and missing migrations
        working-directory: ./backend
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_migrations

      - name: Apply every migration to an empty database
        working-directory: ./backend
        run: python manage.py migrate --noinput --settings=config.settings_migrations

  # Everything the SQLite job above does, on Postgres, the database production
  # runs on: the tests with coverage, a year and a month ahead, and just after
  # the next New Year, each as its own job alongside the rest. SQLite lets
  # through things Postgres refuses, such as a test closing the connection its
  # own transaction is on. For now these don't hold up a deploy (SQLite still
  # does): they run beside SQLite to compare, before SQLite leaves CI.
  backend_tests_postgres:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    name: "Postgres (not blocking): ${{ matrix.label }}"
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: tests with coverage
            coverage: true
            clock_shift_days: '0'
            clock_at: ''
          - label: tests a year and a month ahead
            coverage: false
            clock_shift_days: '400'
            clock_at: ''
          - label: tests just after the next New Year
            coverage: false
            clock_shift_days: '0'
            clock_at: new-year

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        if: matrix.coverage
        working-directory: ./backend
        run: coverage run manage.py test tests --settings=config.settings_test_postgres --noinput

      - name: Enforce coverage threshold (>= 60%)
        if: matrix.coverage
        working-directory: ./backend
        run: coverage report --fail-under=60

      # See backend/tests/clock.py, as for the SQLite job.
      - name: Run tests on the moved clock
        if: ${{ !matrix.coverage }}
        working-directory: ./backend
        env:
          TEST_CLOCK_SHIFT_DAYS: ${{ matrix.clock_shift_days }}
          TEST_CLOCK_AT: ${{ matrix.clock_at }}
        run: python manage.py test tests --settings=config.settings_test_postgres --noinput --testrunner=tests.clock.ShiftedClockRunner

  # Runs alongside the checks rather than after them: the deploys still wait
  # for every check, so nothing ships unless each one passes.
  backend_build:
    needs: changes
    if: needs.changes.outputs.backend == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: Backend build
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      # 🛠️ Local Build Section (Optional)
      # The following section in your workflow is designed to catch build issues early on the client side, before deployment. This can be helpful for debugging and validation. However, if this step significantly increases deployment time and early detection is not critical for your workflow, you may remove this section to streamline the deployment process.
      - name: Create and Start virtual environment and Install dependencies
        working-directory: ./backend
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      # Oryx scans only /home/site/wwwroot/ (not subdirs) for project files
      # during ZipDeploy + SCM_DO_BUILD_DURING_DEPLOYMENT=true. With our
      # multi-path artifact, requirements.txt lands at /wwwroot/backend/...
      # so Oryx doesn't detect Python and never runs pip install (container
      # then crashes with ModuleNotFoundError: django). Surface it at the
      # root so Oryx finds it. The PROJECT app setting is unreliable here.
      - name: Surface requirements.txt at artifact root for Oryx detection
        run: cp backend/requirements.txt requirements.txt

      # By default, when you enable GitHub CI/CD integration through the Azure portal, the platform automatically sets the SCM_DO_BUILD_DURING_DEPLOYMENT application setting to true. This triggers the use of Oryx, a build engine that handles application compilation and dependency installation (e.g., pip install) directly on the platform during deployment. Hence, we exclude the antenv virtual environment directory from the deployment artifact to reduce the payload size.
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            backend/
            requirements.txt
            !backend/antenv/
            !backend/venv/
            !backend/.venv/
            !backend/__pycache__/
            !backend/**/__pycache__/
            !backend/media/
            !backend/staticfiles/

      # 🚫 Opting Out of Oryx Build
      # If you prefer to disable the Oryx build process during deployment, follow these steps:
      # 1. Remove the SCM_DO_BUILD_DURING_DEPLOYMENT app setting from your Azure App Service Environment variables.
      # 2. Refer to sample workflows for alternative deployment strategies: https://github.com/Azure/actions-workflow-samples/tree/master/AppService

  frontend_tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    name: Frontend tests
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # The newest Node that "engines" in frontend/package.json allows. Moving
      # to a new major means raising the cap there.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        # --run forces a single pass; the bare `vitest` script would start
        # watch mode and hang the job on a TTY-less runner.
        run: npm run test:unit -- --run

  # Our build rather than Azure's, on the same Node and lockfile as the tests;
  # `npm run build` runs the type check too. Azure only uploads what it made.
  frontend_build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    name: Frontend type check and build
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check and build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.biotechfutures.org
        run: npm run build

      - name: Keep the build for the deploy
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  # Both deploys wait for every check that ran, on either side; a side the
  # change didn't touch is skipped, which doesn't hold the other one up.
  # Each deploys one run at a time: a second waits for the first rather than
  # overlapping it, which made Azure cancel the first. A deploy still waiting
  # when a newer one queues is dropped, as the newer one has its changes too.
  deploy_backend:
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    needs: [changes, backend_tests, migrations, backend_build, frontend_tests, frontend_build]
    if: >-
      always()
      && needs.changes.outputs.backend == 'true'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    name: Deploy backend
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'biotechBe'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_E877ED0DA3F94A06807A257E92B3A1B1 }}
          package: .

  # A push to main goes live; a pull request gets its own preview site. A pull
  # request from a fork gets none: GitHub gives forks no secrets, so the
  # Azure token is missing and the upload could only fail.
  deploy_frontend:
    concurrency:
      group: deploy-frontend-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'live' }}
      cancel-in-progress: false
    needs: [changes, backend_tests, migrations, backend_build, frontend_tests, frontend_build]
    if: >-
      always()
      && needs.changes.outputs.frontend == 'true'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
        || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    name: Deploy frontend

    steps:
      - name: Fetch the build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_FRONTEND }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true

  # Takes the pull request's preview site down once it's merged or closed. A
  # fork's pull request never had one (see deploy_frontend).
  close_pull_request_job:
    needs: changes
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && needs.changes.outputs.frontend_preview == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_FRONTEND }}
          action: "close"

  # One table on the run's summary page: when each job started, how long it
  # took and when it finished, from the start of the run, then how long the
  # installs and test suites inside them took, to compare SQLite and Postgres
  # side by side. It runs last and never fails the run.
  timings:
    needs: [changes, backend_tests, migrations, backend_tests_postgres, backend_build, frontend_tests, frontend_build, deploy_backend, deploy_frontend, close_pull_request_job]
    if: always()
    runs-on: ubuntu-latest
    name: Timings
    permissions:
      actions: read

    steps:
      - name: Write the timings to the run's summary
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          cat > timings.jq <<'JQ'
          def t: fromdateiso8601;
          def mmss: floor as $s | "\($s / 60 | floor):\($s % 60 | tostring | if length < 2 then "0" + . else . end)";
          ("START_TIME" | t) as $t0
          | [.jobs[] | select(.name != "Timings")] as $jobs
          | ($jobs | map(select(.conclusion != "skipped" and .completed_at != null))) as $ran
          | ($jobs | map(select(.conclusion == "skipped") | .name)) as $skipped
          | "## Timings",
            "",
            "Minutes:seconds, measured from the start of the run.",
            "",
            "| Job | Result | Starts | Takes | Done |",
            "|---|---|---|---|---|",
            ($ran | sort_by(.completed_at)[]
              | "| \(.name) | \(.conclusion) | \((.started_at | t) - $t0 | mmss) | \((.completed_at | t) - (.started_at | t) | mmss) | \((.completed_at | t) - $t0 | mmss) |"),
            "",
            "**Whole run:** \(($ran | map(.completed_at | t) | max) - $t0 | mmss)",
            (if ($skipped | length) > 0 then "", "Skipped: \($skipped | join(", "))" else empty end),
            "",
            "### Inside the jobs",
            "",
            "| Job | Step | Takes |",
            "|---|---|---|",
            ($ran[] | .name as $job | .steps[]?
              | select(.conclusion != "skipped" and .completed_at != null)
              | select(.name | test("^(Install dependencies|Run (unit )?tests|Type check and build)"))
              | "| \($job) | \(.name) | \((.completed_at | t) - (.started_at | t) | mmss) |")
          JQ
          start=$(gh api "$RUN" --jq .run_started_at)
          gh api "$RUN/attempts/$ATTEMPT/jobs?per_page=100" --jq "$(sed "s/START_TIME/$start/" timings.jq)" | tee -a "$GITHUB_STEP_SUMMARY"
