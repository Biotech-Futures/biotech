name: Hourly RSVP reminders

# Hits the HMAC-protected dispatcher endpoint. One call fires
# both reminder kinds (24h + 1h) — see services.send_due_rsvp_reminders
# and the REMINDER_KINDS registry.
#
# Required configuration:
#   secret  EMAIL_JOBS_TOKEN   shared by every email job; must match the
#                              backend env of the same name
#
# Run by hand only (Actions > Run workflow), as a backup: the backend runs
# this itself every hour (apps.management.scheduler).
on:
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger RSVP reminder dispatch
        env:
          BACKEND_URL: https://api.biotechfutures.org
          JOBS_TOKEN: ${{ secrets.EMAIL_JOBS_TOKEN }}
        run: |
          if [ -z "${JOBS_TOKEN}" ]; then
            echo "EMAIL_JOBS_TOKEN is not set (repository secret)." >&2
            exit 1
          fi
          # -f makes curl exit non-zero on HTTP >=400 so the workflow
          # surfaces auth or server failures instead of silently
          # succeeding. -sS keeps output quiet but still prints errors.
          curl -fsS -X POST \
            -H "X-Email-Jobs-Token: ${JOBS_TOKEN}" \
            -H "Content-Type: application/json" \
            "${BACKEND_URL%/}/events/v1/admin/send-rsvp-reminders/"
