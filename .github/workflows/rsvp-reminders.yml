name: Hourly RSVP reminders

# Hits the HMAC-protected dispatcher endpoint every hour. One call fires
# both reminder kinds (24h + 1h) — see services.send_due_rsvp_reminders
# and the REMINDER_KINDS registry.
#
# Required configuration:
#   secret  RSVP_REMINDER_TOKEN   shared by every email job for now; must
#                                 match the backend env of the same name.
#                                 Moves to EMAIL_JOBS_TOKEN once that's set
#                                 on GitHub and Azure.
#
# Off-peak minute (23) avoids GitHub's top-of-hour cron load spike,
# which can otherwise drift the run by 10+ minutes and miss the window.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger RSVP reminder dispatch
        env:
          BACKEND_URL: https://api.biotechfutures.org
          JOBS_TOKEN: ${{ secrets.RSVP_REMINDER_TOKEN }}
        run: |
          if [ -z "${JOBS_TOKEN}" ]; then
            echo "RSVP_REMINDER_TOKEN is not set (repository secret)." >&2
            exit 1
          fi
          # -f makes curl exit non-zero on HTTP >=400 so the workflow
          # surfaces auth or server failures instead of silently
          # succeeding. -sS keeps output quiet but still prints errors.
          curl -fsS -X POST \
            -H "X-Email-Jobs-Token: ${JOBS_TOKEN}" \
            -H "Content-Type: application/json" \
            "${BACKEND_URL%/}/events/v1/admin/send-rsvp-reminders/"
