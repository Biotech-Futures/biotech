name: Daily submission reminders

# Nudges teams whose entry is still outstanding, every day for the last week
# before their deadline. The backend decides who is due — including honouring
# any extension a team has been granted — so this only has to fire once a day.
#
# Firing more often than that is harmless: a team already written to today is
# skipped, so a retry or an overlapping run cannot email anyone twice.
#
# Required configuration:
#   secret  EMAIL_JOBS_TOKEN   shared by every email job; must match the
#                              backend env of the same name
#
# 21:00 UTC (8am in Sydney under daylight saving, 7am in winter), last of
# the daily emails. The backend runs these itself once SCHEDULER_ENABLED is
# set (apps.management.scheduler), at the same time.
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger submission reminder dispatch
        env:
          BACKEND_URL: https://api.biotechfutures.org
          JOBS_TOKEN: ${{ secrets.EMAIL_JOBS_TOKEN }}
        run: |
          if [ -z "${JOBS_TOKEN}" ]; then
            echo "EMAIL_JOBS_TOKEN is not set (repository secret)." >&2
            exit 1
          fi
          # -f makes curl exit non-zero on HTTP >=400 so the workflow surfaces
          # auth or server failures instead of silently succeeding. -sS keeps
          # the output quiet but still prints errors.
          curl -fsS -X POST \
            -H "X-Email-Jobs-Token: ${JOBS_TOKEN}" \
            -H "Content-Type: application/json" \
            "${BACKEND_URL%/}/api/v1/submissions/admin/send-reminders/"
