name: Weekly supervisor registration status

# Emails each supervisor whose students aren't all registered yet (a
# permission form still to sign): how many are complete, waiting for a
# signature, or waiting for guardian details. Once a week, until every one of
# their students is complete. The backend decides who is due (not emailed in
# the last 7 days), so this fires once a day: a missed run is made up the
# next day.
#
# Firing more often than that is harmless: a supervisor emailed in the last
# week is skipped, so a retry or an overlapping run cannot email anyone twice.
#
# Required configuration:
#   secret  EMAIL_JOBS_TOKEN   shared by every email job; must match the
#                              backend env of the same name
#
# 20:00 UTC (7am in Sydney under daylight saving, 6am in winter), an hour
# after the guardian details reminders. The backend runs these itself once
# SCHEDULER_ENABLED is set (apps.management.scheduler), at the same time.
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger supervisor registration status emails
        env:
          BACKEND_URL: https://api.biotechfutures.org
          JOBS_TOKEN: ${{ secrets.EMAIL_JOBS_TOKEN }}
        run: |
          if [ -z "${JOBS_TOKEN}" ]; then
            echo "EMAIL_JOBS_TOKEN is not set (repository secret)." >&2
            exit 1
          fi
          # -f makes curl exit non-zero on HTTP >=400 so the workflow surfaces
          # auth or server failures instead of silently succeeding.
          curl -fsS -X POST \
            -H "X-Email-Jobs-Token: ${JOBS_TOKEN}" \
            -H "Content-Type: application/json" \
            "${BACKEND_URL%/}/api/v1/admin/send-supervisor-registration-status/"
