name: Open support enquiries, morning count

# Emails the support inbox the number of enquiries still open, every morning
# (C-18: the client asked for "a daily digest ... this is the number of
# inquiries open"). The backend counts and decides; on a morning with nothing
# open it sends nothing.
#
# A second run the same day sends a second count. That is left as it is: it
# goes to one shared inbox, and the numbers it carries are true when sent.
#
# It is called the way the platform's other scheduled emails are: the backend
# at its fixed address, with the email jobs' shared token in the
# X-Email-Jobs-Token header (backend/apps/common/email_jobs.py). So the one
# thing it needs is the EMAIL_JOBS_TOKEN repository secret, which those jobs
# already use, matching the backend setting of the same name.
#
# 22:07 UTC is 9:07 in Sydney while daylight saving is on (October to April)
# and 8:07 outside it: before the working day, so the count is waiting when
# the team starts. The odd minute dodges GitHub's top-of-hour scheduler spike.
on:
  schedule:
    - cron: "7 22 * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger the open-enquiry count
        env:
          BACKEND_URL: https://api.biotechfutures.org
          JOBS_TOKEN: ${{ secrets.EMAIL_JOBS_TOKEN }}
        run: |
          if [ -z "${JOBS_TOKEN}" ]; then
            echo "EMAIL_JOBS_TOKEN is not set (repository secret)." >&2
            exit 1
          fi
          # -f makes curl exit non-zero on HTTP >=400 so a refused token or a
          # server error fails the run instead of passing quietly.
          curl -fsS -X POST \
            -H "X-Email-Jobs-Token: ${JOBS_TOKEN}" \
            -H "Content-Type: application/json" \
            "${BACKEND_URL%/}/api/v1/admin/tickets/digest/send/"
