name: Unread-messages digest

# Hits the HMAC-protected digest dispatcher. The endpoint throttles per user
# (ChatDigestState high-water mark + 8h cadence + overnight quiet hours in
# Sydney time), so how often it runs only bounds how soon the FIRST email
# lands after a message goes unread: a couple of daytime emails per user per
# day at most.
#
# Required configuration:
#   secret  EMAIL_JOBS_TOKEN   shared by every email job; must match the
#                              backend env of the same name
#
# Run by hand only (Actions > Run workflow), as a backup: the backend runs
# this itself every 15 minutes (apps.management.scheduler).
on:
  workflow_dispatch:

# The endpoint dedups overlapping triggers server-side; this just stops GH
# runs piling up if the API is slow.
concurrency:
  group: unread-digest
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger unread-messages digest
        env:
          BACKEND_URL: https://api.biotechfutures.org
          JOBS_TOKEN: ${{ secrets.EMAIL_JOBS_TOKEN }}
        run: |
          if [ -z "${JOBS_TOKEN}" ]; then
            echo "EMAIL_JOBS_TOKEN is not set (repository secret)." >&2
            exit 1
          fi
          # -f makes curl exit non-zero on HTTP >=400 so the workflow surfaces
          # auth or server failures instead of silently succeeding. The endpoint
          # 202s immediately and runs the digest on a background thread (the
          # full run used to blow Azure's ~230s gateway cap -> 504), so a slow
          # response now means something is actually wrong: fail fast at 60s.
          # Sent/failed counts are in the backend logs (unread_digest.completed).
          curl -fsS --max-time 60 -X POST \
            -H "X-Email-Jobs-Token: ${JOBS_TOKEN}" \
            -H "Content-Type: application/json" \
            "${BACKEND_URL%/}/api/v1/chat/admin/send-unread-digest/"
